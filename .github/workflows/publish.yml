name: publish

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      redis-cluster:
        image: grokzen/redis-cluster:7.0.10
        ports:
          - 7006:7000
          - 7001:7001
          - 7002:7002
          - 7003:7003
          - 7004:7004
          - 7005:7005
    
    strategy:
      matrix:
        node-version: [lts/*]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Artifactory OIDC Login
        uses: liveviewtech/actions/artifactory/oidc-login@v3
        with:
          provider-name: github-oidc-npm

      - name: Install Dependencies
        run: |-
          echo "${NPMRC_ARTIFACTORY_AUTH}" >> ~/.npmrc
          npm ci

      - name: Publish to npm
        run: npm publish
